services:
  db:
    image: postgres:14.1-alpine
    container_name: brewlite-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin111
      POSTGRES_DB: my_postgres_DB
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
