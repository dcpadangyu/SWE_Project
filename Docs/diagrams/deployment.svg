<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">BrewLite - Sơ đồ triển khai môi trường Production</title>
  <desc id="desc">Người dùng truy cập dịch vụ Next.js, dịch vụ này gọi API NestJS. API kết nối đến PostgreSQL lưu trữ bền vững và cổng thanh toán.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 14px; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .service { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .db { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .cloud { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .edge { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">BrewLite - Sơ đồ triển khai môi trường Production</text>

  <rect x="35" y="90" width="180" height="105" class="box"/>
  <text x="125" y="125" text-anchor="middle" class="label">Thiết bị người dùng</text>
  <text x="125" y="153" text-anchor="middle" class="small">Trình duyệt / PWA</text>
  <text x="125" y="177" text-anchor="middle" class="small">HTTPS</text>

  <rect x="285" y="75" width="285" height="140" class="service"/>
  <text x="427" y="110" text-anchor="middle" class="label">Dịch vụ Web / CDN</text>
  <text x="427" y="140" text-anchor="middle" class="small">Giao diện Next.js</text>
  <text x="427" y="165" text-anchor="middle" class="small">Tài nguyên tĩnh + SSR</text>
  <text x="427" y="190" text-anchor="middle" class="small">Không chứa secret DB</text>

  <rect x="650" y="75" width="285" height="140" class="service"/>
  <text x="792" y="110" text-anchor="middle" class="label">Dịch vụ API</text>
  <text x="792" y="140" text-anchor="middle" class="small">Container NestJS</text>
  <text x="792" y="165" text-anchor="middle" class="small">HTTPS công khai → :8080</text>
  <text x="792" y="190" text-anchor="middle" class="small">Health check + log</text>

  <rect x="320" y="330" width="285" height="145" class="db"/>
  <text x="462" y="365" text-anchor="middle" class="label">PostgreSQL được quản lý</text>
  <text x="462" y="395" text-anchor="middle" class="small">Lưu trữ bền vững</text>
  <text x="462" y="420" text-anchor="middle" class="small">TLS / mạng nội bộ :5432</text>
  <text x="462" y="450" text-anchor="middle" class="small">Sao lưu + lưu giữ</text>

  <path d="M1010 330 C1085 285 1160 330 1140 390 C1160 445 1070 480 1010 440 C960 430 955 350 1010 330 Z" class="cloud"/>
  <text x="1060" y="370" text-anchor="middle" class="label">Cổng thanh toán</text>
  <text x="1060" y="398" text-anchor="middle" class="small">Giả lập / bên ngoài</text>
  <text x="1060" y="426" text-anchor="middle" class="small">HTTPS</text>

  <path d="M215 142 H285" class="edge"/>
  <text x="250" y="130" text-anchor="middle" class="small">HTTPS</text>
  <path d="M570 145 H650" class="edge"/>
  <text x="610" y="132" text-anchor="middle" class="small">REST + CORS</text>
  <path d="M792 215 V285 H462 V330" class="edge"/>
  <text x="625" y="270" text-anchor="middle" class="small">TLS / mạng nội bộ 5432</text>
  <path d="M935 145 H1030 V330" class="edge"/>
  <text x="1000" y="205" text-anchor="middle" class="small">HTTPS</text>

  <rect x="85" y="570" width="1030" height="115" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="10"/>
  <text x="110" y="605" class="label">Phân tách môi trường</text>
  <text x="110" y="635" class="small">Local: dịch vụ localhost và file .env không commit.</text>
  <text x="110" y="660" class="small">CI: chỉ lint, test và build; không dùng secret/DB Production.</text>
  <text x="650" y="635" class="small">Production: HTTPS công khai, secret được quản lý, DB nội bộ,</text>
  <text x="650" y="660" class="small">health check, log có cấu trúc và sao lưu bền vững.</text>
</svg>
